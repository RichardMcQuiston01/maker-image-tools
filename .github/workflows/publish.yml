name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          for pkg in core-image core-vector gcode; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match @richardmcquiston01/$pkg version $version" >&2
              exit 1
            fi
          done

      - name: Publish (dependency order)
        run: |
          node scripts/publish-package.mjs packages/core-image
          node scripts/publish-package.mjs packages/core-vector
          node scripts/publish-package.mjs packages/gcode
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          BUN_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
