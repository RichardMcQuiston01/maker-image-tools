name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maker
          POSTGRES_PASSWORD: maker
          POSTGRES_DB: maker_accounts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Create per-service test databases
        run: |
          PGPASSWORD=maker psql -h localhost -U maker -d maker_accounts_test -c "CREATE DATABASE maker_billing_test"
          PGPASSWORD=maker psql -h localhost -U maker -d maker_accounts_test -c "CREATE DATABASE maker_cloud_projects_test"

      - name: Test (non-Postgres workspaces)
        run: bun run --filter='!@maker/{accounts,billing,cloud-projects}' --if-present test

      - name: Test @maker/accounts
        run: bun run --filter=@maker/accounts test
        env:
          DATABASE_URL: postgres://maker:maker@localhost:5432/maker_accounts_test

      - name: Test @maker/billing
        run: bun run --filter=@maker/billing test
        env:
          DATABASE_URL: postgres://maker:maker@localhost:5432/maker_billing_test

      - name: Test @maker/cloud-projects
        run: bun run --filter=@maker/cloud-projects test
        env:
          DATABASE_URL: postgres://maker:maker@localhost:5432/maker_cloud_projects_test
